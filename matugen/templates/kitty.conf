font_family      JetBrainsMono Nerd Font Mono
font_size        12

background        {{colors.surface.default.hex}}
foreground        {{colors.on_surface.default.hex}}
cursor            {{colors.primary.default.hex}}
selection_background {{colors.primary_container.default.hex}}

color0            {{colors.surface_container.default.hex}}
color8            {{colors.surface_container_high.default.hex}}
color1            {{colors.error.default.hex}}
color9            {{colors.error_container.default.hex}}
color2            {{colors.tertiary_container.default.hex}}
color10           {{colors.on_tertiary_container.default.hex}}
color3            {{colors.secondary_container.default.hex}}
color11           {{colors.on_secondary_container.default.hex}}
color4            {{colors.primary.default.hex}}
color12           {{colors.primary_container.default.hex}}
color5            {{colors.secondary.default.hex}}
color13           {{colors.tertiary.default.hex}}
color6            {{colors.tertiary.default.hex}}
color14           {{colors.on_tertiary_container.default.hex}}
color7            {{colors.on_surface.default.hex}}
color15           {{colors.outline.default.hex}}

background_opacity 0.65
dynamic_background_opacity yes
macos_option_as_alt yes

shell_integration enabled

mark1_foreground {{colors.primary.default.hex}}
mark1_background {{colors.surface_container.default.hex}}
mark2_foreground {{colors.tertiary.default.hex}}
mark2_background {{colors.surface_container_high.default.hex}}

tab_bar_style     powerline
window_padding_width 8

map ctrl+shift+t  new_tab
map ctrl+shift+Enter new_window
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1
